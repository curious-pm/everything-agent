name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, please use the Security tab instead of an issue.
        Never paste API keys or your PIN; the app's logs don't contain them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where are you running it?
      options:
        - On the robot (Reachy Mini Wireless)
        - Desktop app on Windows
        - Desktop app on macOS
        - From source
    validations:
      required: true
  - type: dropdown
    id: robot
    attributes:
      label: Robot
      options:
        - Reachy Mini plugged in over USB
        - Reachy Mini Wireless
        - No robot (laptop microphone and speaker)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of Settings.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: AI model and provider
      placeholder: google/gemini-2.5-flash on OpenRouter
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings → Advanced → Logs. Paste the lines around the problem.
      render: text
